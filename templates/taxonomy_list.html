{% extends "base.html" %} {% block title %}Tags · {{ config.title }}{% endblock
    title %} {% block content %}
<section class="page">
    <header>
        <h1>Tags</h1>
    </header>
    <ul class="post-list">
        {% for term in terms %}
            <li class="post">
                <h2 class="post-title">
                    <a href="{{ term.permalink }}">#{{ term.name }}</a>
                </h2>
                <p class="post-summary">
                    {{ term.pages | length }} post{% if term.pages | length != 1 %}s{% endif
                        %}
                </p>
            </li>
        {% endfor %}
    </ul>
</section>
{% endblock content %}
