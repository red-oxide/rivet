name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # "Update flake inputs" pushes with the built-in token, which doesn't
  # start other workflows, so check its lock updates when it finishes.
  workflow_run:
    workflows: ["Update flake inputs"]
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    uses: red-oxide/github-workflows/.github/workflows/check.yml@master
