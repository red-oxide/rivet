name: Update flake inputs

on:
  schedule:
    # Every day at midnight UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-flake-lock:
    uses: red-oxide/github-workflows/.github/workflows/update-flake-lock.yml@master
    permissions:
      contents: write
