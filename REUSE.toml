# the rest of tack; it carries its own SPDX line.
version = 1

[[annotations]]
SPDX-FileCopyrightText  = "2026 Chris Palmer <chris@red-oxide.org>"
SPDX-License-Identifier = "MIT"
path                    = ["sass/_palette.scss", "templates/theme-check.html"]

# Written by tack.
[[annotations]]
SPDX-FileCopyrightText  = "2026 Chris Palmer <chris@red-oxide.org>"
SPDX-License-Identifier = "MIT"
path                    = [".tack/.gitignore", ".tack/pins.lock.json"]

# Written by tack; edits would stop tack from updating it.
[[annotations]]
SPDX-FileCopyrightText  = "tack contributors <https://github.com/manic-systems/tack>"
SPDX-License-Identifier = "EUPL-1.2"
path                    = [".tack/default.nix"]
precedence              = "aggregate"
